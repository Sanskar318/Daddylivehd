name: Update 247 Channels M3U

on:
  schedule:
    # Har 6 ghante mein run hoga
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual run ke liye

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: Run 247 scraper script
        run: |
          python scraper_247.py

      - name: Commit and push playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daddy/
          git diff --staged --quiet || git commit -m "Auto-update 24/7 channels M3U [skip ci]"
          git push
          
